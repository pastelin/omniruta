# ============================================================
# SERVIDOR HTTP
# ============================================================

server.port=8080

# ============================================================
# LOGGING DE DEPURACION - Spring Security
# TEMPORAL: muestra en el log qu\u00e9 regla/matcher decide cada request
# (permitAll / hasRole / denegado) y con qu\u00e9 authorities. Quitar en producci\u00f3n.
# ============================================================
logging.level.org.springframework.security.web.access.intercept=DEBUG
logging.level.org.springframework.security.web.authentication=DEBUG
logging.level.org.springframework.security.authorization=DEBUG


# ============================================================
# SUBIDA DE ARCHIVOS
# ============================================================

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB


# ============================================================
# MYSQL
# ============================================================

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:fast_home_health}?useUnicode=true&characterEncoding=utf8&serverTimezone=America/Mexico_City&useSSL=false&allowPublicKeyRetrieval=true

spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}


# ============================================================
# HIKARICP
# ============================================================

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=appHikari


# ============================================================
# JPA / HIBERNATE
# ============================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.jdbc.time_zone=America/Mexico_City


# ============================================================
# SOCKET.IO
# ============================================================

socket-server.host=${SOCKET_HOST:0.0.0.0}
socket-server.port=${SOCKET_PORT:8083}


# ============================================================
# REDIS
# ============================================================

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USERNAME:default}
spring.data.redis.password=${REDIS_PASSWORD}


# ============================================================
# SWAGGER / SPRINGDOC
# ============================================================

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/doc

springdoc.paths-to-match=/api/**,/personalAuthentication/**,/clientRegister/**,/paymentsMethods/**,/authentication/client/**


# ============================================================
# EMAIL
# ============================================================

spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}

spring.mail.username=${MAIL_USER}
spring.mail.password=${MAIL_PASS}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.mail.properties.mail.smtp.starttls.required=true

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ============================================================
# GOOGLE MAPS
# ============================================================

google.maps.api.key=${API_KEY}


# ============================================================
# STRIPE
# ============================================================

stripe.secret-key=${STRIPE_KEY}


# ============================================================
# SPRING
# ============================================================

# --- Servidor HTTP/WebSocket ---
server.port=8080

# --- Subida de archivos (typo corregido: spring.servlet.multipart.*) ---
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# --- Datasource MySQL (lee secretos desde variables de entorno con defaults seguros) ---
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:fast_home_health}?useUnicode=true&characterEncoding=utf8&serverTimezone=America/Mexico_City&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:admin}

# --- HikariCP (valores sanos por defecto; los tuyos estaban muy bajos) ---
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=appHikari

# --- JPA/Hibernate (typo corregido: spring.jpa.show-sql) ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.jdbc.time_zone=America/Mexico_City

# --- Propiedades de tu socket (custom) ---
socket-server.host=${SOCKET_HOST:0.0.0.0}
socket-server.port=${SOCKET_PORT:8083}

# --- Springdoc / Swagger ---
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/doc
# NOTA: si usas springdoc v1 (Boot 2.x), usa 'springdoc.pathsToMatch'.
# si usas springdoc v2 (Boot 3.x), usa 'springdoc.paths-to-match':
springdoc.paths-to-match=/api/**,/personalAuthentication/**,/clientRegister/**,/paymentsMethods/**,/authentication/client/**

# --- Mail (mueve credenciales a variables de entorno) ---
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USER}
spring.mail.password=${MAIL_PASS}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# --- Otros ---
spring.main.allow-circular-references=true

